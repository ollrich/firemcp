name: Build and Release MCP Server as DXT

on:
  release:
    types: [published]

# Uploading release assets needs write access; new repositories default to read only.
permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
    
    - name: Install root dependencies
      run: npm install
    
    - name: Install MCP server dependencies
      run: npm install --prefix mcp-server
    
    - name: Build MCP server package
      # Tags are v2.0.1, assets firemcp-2.0.1.dxt like the XPI.
      run: cd mcp-server && TAG="${{ github.event.release.tag_name }}" && npm run pack-dxt -- "firemcp-${TAG#v}.dxt"

    - name: Upload package to release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="${{ github.event.release.tag_name }}"
        gh release upload "$TAG" "./mcp-server/firemcp-${TAG#v}.dxt" --clobber

